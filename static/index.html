<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Swipe Prototype</title>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #f4f4f4; 
            margin: 0;
            padding: 20px;
        }

        /* 1. Filter Section stays at the top */
        .filter-section { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            width: 320px;
        }

        /* 2. The STAGE: This gives the absolute card a home so it doesn't overlap filters */
        #swipe-stage {
            position: relative;
            width: 100%;
            height: 480px; /* Matches card height + a little extra */
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* 3. The CARD: The actual swiping element */
        #card {
            width: 320px;
            height: 450px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: grab;
            user-select: none;
            touch-action: none;
            position: absolute; /* Vital for JS movement */
            box-sizing: border-box; /* Ensures padding doesn't break width */
        }

        .btn-group { 
            display: flex;
            gap: 10px;
            z-index: 10; /* Keeps buttons clickable if card overlaps */
        }

        button { padding: 10px 20px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
        .btn-match { background: #4CAF50; color: white; }
        .btn-skip { background: #f44336; color: white; }
        
        #counter { margin-bottom: 10px; font-weight: bold; color: #666; }
        .tag { background: #eee; padding: 5px; border-radius: 4px; font-size: 0.8em; margin: 2px; display: inline-block; }

        .website-btn {
            display: block;
            background: #007bff;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        
        .website-btn:hover { background: #0056b3; }

    </style>
</head>
<body>

    <h2>BiteSwipe</h2>

    <div class="filter-section">
        <h4>Filters</h4>
        <label>Max Distance (km): <input type="number" id="dist-input" value="1.5" step="0.1" min="0.1" max="1.5"></label><br><br>
        <div id="dietary-filters">
            <label><input type="checkbox" class="diet-check" value="halal"> Halal</label>
            <label><input type="checkbox" class="diet-check" value="vegan"> Vegan</label>
            <label><input type="checkbox" class="diet-check" value="vegetarian"> Vegetarian</label>
        </div><br>
        <button onclick="applyFilters()">Apply Filters & Restart</button>
    </div>

    <div id="counter">Card 0 of 0</div>

    <div id="swipe-stage">
        <div id="card">
            <div style="text-align: center; margin-top: 50%;">
                <h3>Press "Apply Filters" to Start</h3>
            </div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-skip" onclick="animateOut('left')">❌ Skip</button>
        <button class="btn-match" onclick="animateOut('right')">✅ Match</button>
    </div>

    <script src="static/app.js"></script>
</body>
</html>
