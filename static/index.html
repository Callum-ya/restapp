<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Swipe Prototype</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f4f4; }
        .filter-section { background: white; padding: 20px; border-radius: 8px; margin: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card-container { width: 300px; height: 400px; background: white; border-radius: 15px; display: flex; 
                          flex-direction: column; justify-content: center; align-items: center; 
                          text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; }
        .btn-group { margin-top: 20px; }
        button { padding: 10px 20px; cursor: pointer; border-radius: 5px; border: none; margin: 5px; }
        .btn-match { background: #4CAF50; color: white; }
        .btn-skip { background: #f44336; color: white; }
        #counter { margin-bottom: 10px; font-weight: bold; color: #666; }
        .tag { background: #eee; padding: 5px; border-radius: 4px; font-size: 0.8em; margin: 2px; display: inline-block; }
    </style>
</head>
<body>

    <h2> BiteSwipe</h2>

    <div class="filter-section">
        <h4>Filters</h4>
        <label>Max Distance (km): <input type="number" id="dist-input" value="1.5" step="0.1" min="0.1" max="1.5"></label><br><br>
        <div id="dietary-filters">
            <label><input type="checkbox" class="diet-check" value="halal"> Halal</label>
            <label><input type="checkbox" class="diet-check" value="vegan"> Vegan</label>
            <label><input type="checkbox" class="diet-check" value="vegetarian"> Vegetarian</label>
        </div><br>
        <button onclick="applyFilters()">Apply Filters & Restart</button>
    </div>

    <div id="counter">Card 0 of 0</div>

    <div id="card" class="card-container">
        
        <h3>Press "Apply Filters" to Start</h3>
    </div>

    <div class="btn-group">
        <button class="btn-skip" onclick="handleSwipe('left')">❌ Skip</button>
        <button class="btn-match" onclick="handleSwipe('right')">✅ Match</button>
    </div>

    <script src="static/app.js"></script>
</body>
</html>
