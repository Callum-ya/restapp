<!DOCTYPE html>
<html>
    
  <head>
    <title>Saved Restaurants</title>
  </head>
  
  <style>
    .nav-btn.saved {
    background-color: #f3c758; 
    }
    .nav-btn.saved:hover {
      background-color: #d9ab40; 
      transform: scale(1.05);
    }
    .save-btn {
      margin-top: 15px;
      padding: 10px 25px;
      font-size: 16px;
      font-weight: bold;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
    
    .save-btn:hover {
      background-color: #618e3c;
      transform: scale(1.05);
    }
    
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: #FF7F50;
      color: white;
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      z-index: 1000;
    }
    
    .back-btn:hover {
      background-color: #FF6347;
    }
    
    .favourites-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }
    
    .favourites-container .box {
      width: 300px;
      height: auto;
      padding: 15px;
    }
  </style>


<body>

<h2> BiteSwipe</h2>
  <h4> Saved Restaraunts</h4>
  

  <button onclick="history.back()" class="back-btn">←</button>

  <div id="favouritesList" class="favourites-container"></div>

<script>
const list = document.getElementById("favouritesList");
let favourites = JSON.parse(localStorage.getItem("favourites")) || [];

function renderFavourites() {

  list.innerHTML = "";

  if (favourites.length === 0) {
    list.innerHTML = "<p style='text-align:center;'>No saved restaurants 😢</p>";
    return;
  }

  favourites.forEach((r, index) => {

    const card = document.createElement("div");
    card.className = "box";

    /* Create tags HTML */
    let tagsHTML = "";
    if (r.tags) {
      r.tags.forEach(tag => {
        tagsHTML += `<span class="tag">${tag}</span>`;
      });
    }

    card.innerHTML = `
      <img src="images/${r.image}" class="restaurant-img">
      <h2>${r.name}</h2>
      <p>${r.rating}</p>

      <div class="tags">
        ${tagsHTML}
      </div>

      <p>${r.description}</p>

      <button class="remove-btn">Remove ❌</button>
    `;

    card.querySelector(".remove-btn").onclick = () => {
      favourites.splice(index, 1);
      localStorage.setItem("favourites", JSON.stringify(favourites));
      renderFavourites();
    };

    list.appendChild(card);
  });
}

renderFavourites();
</script>

</body>
</html>
