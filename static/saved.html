<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Restaurants</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
    }

    h2 { color: #2d3436; margin-bottom: 0; }
    h4 { margin-top: 5px; color: #555; }

    .favourites-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 20px; 
      width: 100%;
      max-width: 1200px;
      margin-top: 20px;
      justify-items: center;
    }

    .card {
      width: 100%;
      max-width: 220px;
      background: white;
      border-radius: 20px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .restaurant-img {
      width: 100%;
      border-radius: 15px;
    }

    .restaurant-content h2 { font-size: 1.5rem; margin-bottom: 5px; color: #2d3436; }
        .distance-badge { color: #0984e3; font-weight: bold; margin-bottom: 15px; }
        .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
        .tag { 
            background: #dfe6e9; 
            color: #2d3436;
            padding: 4px 10px; 
            border-radius: 20px; 
            font-size: 0.75em; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }


    .remove-btn {
      margin-top: 10px;
      padding: 8px 15px;
      border-radius: 20px;
      border: none;
      background: #ff4d4d;
      color: white;
      cursor: pointer;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: #FF7F50;
      color: white;
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2> SwipeBite </h2>
  <h4> Saved Restaurants</h4>

  <button onclick="history.back()" class="back-btn">←</button>

  <div id="favouritesList" class="favourites-container"></div>

  <script>
    const list = document.getElementById("favouritesList");

    function renderFavourites() {
      let favourites = JSON.parse(localStorage.getItem("favourites")) || [];
      list.innerHTML = "";

      if (favourites.length === 0) {
        list.innerHTML = "<p> No saved restaurants</p>";
        return;
      }

      favourites.forEach((r, index) => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="restaurant-content">
                <h2>${r.name}</h2>
                <p class="distance-badge">📍 ${r.distance ? r.distance.toFixed(1) : "N/A"} km away</p>
                <p><strong>Cuisines:</strong> ${r.cuisines && r.cuisines.length ? r.cuisines.join(", ") : "Various"}</p>
                <div class="tags">
                    ${r.dietary ? r.dietary.map(t => `<span class="tag">${t}</span>`).join("") : ""}
                </div>
                <button class="remove-btn">Remove</button>
            </div>
        `;

        card.querySelector(".remove-btn").onclick = () => {
            favourites.splice(index, 1);
            localStorage.setItem("favourites", JSON.stringify(favourites)); 
            renderFavourites(); 
        };

        list.appendChild(card);
    });
}

renderFavourites();
  </script>

</body>
</html>
